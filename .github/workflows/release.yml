name: Release Desktop Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Electron binary is ready
        run: node node_modules/electron/install.js

      - name: Build App & Executables
        shell: pwsh
        run: |
          npm run build:all
          if (-not (Test-Path "dist-server/index.cjs")) {
            Write-Error "dist-server/index.cjs was not built!"
            exit 1
          }
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "dist/index.html was not built!"
            exit 1
          }
          npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exeFiles = Get-ChildItem -Path release -Filter "MonoTerminal*.exe" | ForEach-Object { $_.FullName }
          Write-Host "Found executable files to publish:"
          $exeFiles | ForEach-Object { Write-Host " - $_" }

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating Release $tag..."
            gh release create $tag $exeFiles --title "MonoTerminal $tag" --generate-notes
          } else {
            Write-Host "Release $tag already exists. Uploading assets with --clobber..."
            gh release upload $tag $exeFiles --clobber
          }

name: Release Desktop Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure native binaries are ready
        shell: bash
        run: |
          node node_modules/electron/install.js
          npx esbuild --version

      - name: Build Frontend
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee front.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "### ❌ Frontend Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat front.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Build Backend Server
        shell: bash
        run: |
          set +e
          npm run build:server 2>&1 | tee server.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "### ❌ Backend Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat server.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not (Test-Path "dist-server/index.cjs")) {
            Write-Error "dist-server/index.cjs was not found!"
            exit 1
          }
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "dist/index.html was not found!"
            exit 1
          }
          Write-Host "Build artifacts verified successfully:"
          Get-Item dist-server/index.cjs, dist/index.html | Select-Object FullName, Length | Format-Table

      - name: Package Windows Executables
        shell: bash
        # --publish never 是必需的：CI 中一旦同时存在 tag 与 GH_TOKEN，
        # electron-builder 会按默认策略（onTagOrDraft）自行创建 draft release
        # 并上传产物，与下方「Publish GitHub Release」步骤形成两个发布者。
        # 后果是产物被锁在草稿里、对外不可见（公众 API 查不到任何 Release），
        # 还会出现同 tag 的重复草稿。发布动作统一交给 gh，故此处显式关闭。
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 注意：不要用 $ErrorActionPreference='Continue' 把 gh 的失败吞掉。
        # 历史上这里一旦出错仍会报 succeed，造成「CI 全绿、Release 却是空的」。
        # 因此每一步都显式检查 $LASTEXITCODE 并在失败时 throw，末尾再兜底校验草稿状态。
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $exeFiles = Get-ChildItem -Path release -Filter "MonoTerminal*.exe" | ForEach-Object { $_.FullName }
          if (-not $exeFiles) { throw "release/ 下没有找到任何 MonoTerminal*.exe，打包步骤是否真的成功了？" }

          Write-Host "将发布以下文件："
          $exeFiles | ForEach-Object { Write-Host " - $_" }

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "创建 Release $tag ..."
            gh release create $tag $exeFiles --title "MonoTerminal $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create 失败 (exit=$LASTEXITCODE)" }
          } else {
            Write-Host "Release $tag 已存在，覆盖上传资产 ..."
            gh release upload $tag $exeFiles --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload 失败 (exit=$LASTEXITCODE)" }
            # 若已有 Release 处于草稿状态，转正为正式发布对外可见
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw "gh release edit --draft=false 失败 (exit=$LASTEXITCODE)" }
          }

          # 兜底校验：必须能查到该 Release，且不是草稿（草稿对外不可见）
          $json = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "无法读取 Release $tag" }
          if ($json.isDraft) { throw "Release $tag 仍是 draft，对外不可见，发布未生效！" }
          Write-Host "发布完成：$($json.assets.Count) 个资产，已对外可见。"
